[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mantishrimp"
version = "0.1.0"
description = "Agent-based modelling of killer immune cell-target cell interactions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "MantiShrimp contributors"},
]
keywords = [
  "agent-based model",
  "natural killer cells",
  "tumour immunology",
  "Bayesian inference",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
]

[project.optional-dependencies]
inference = [
  "arviz>=0.17",
  "pymc>=5.10",
  "pytensor>=2.18",
]
plot = [
  "arviz>=0.17",
  "matplotlib>=3.7",
  "pymc>=5.10",
  "pytensor>=2.18",
  "seaborn>=0.12",
]
test = [
  "pytest>=7.4",
]
all = [
  "arviz>=0.17",
  "matplotlib>=3.7",
  "pymc>=5.10",
  "pytensor>=2.18",
  "pytest>=7.4",
  "seaborn>=0.12",
]

[project.urls]
Repository = "https://github.com/sthsci/MantiShrimp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
