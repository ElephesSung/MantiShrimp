[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mantishrimp"
version = "0.1.0"
description = "Agent-based modelling of killer immune cell-target cell interactions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Elephes Sung"},
  {name = "Szonja Skenderovic"},
  {name = "Yixuan Li"},
  {name = "Ruben Perez-Carrasco"},
]
keywords = [
  "agent-based model",
  "natural killer cells",
  "tumour immunology",
  "Bayesian inference",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
]

[project.optional-dependencies]
inference = [
  "arviz>=0.17,<1",
  "pymc>=5.10,<6",
  "pytensor>=2.18,<3",
]
plot = [
  "arviz>=0.17,<1",
  "matplotlib>=3.7",
  "pymc>=5.10,<6",
  "pytensor>=2.18,<3",
  "seaborn>=0.12",
]
test = [
  "pytest>=7.4",
]
all = [
  "arviz>=0.17,<1",
  "matplotlib>=3.7",
  "pymc>=5.10,<6",
  "pytensor>=2.18,<3",
  "seaborn>=0.12",
]

[project.urls]
Homepage = "https://github.com/sthsci/MantiShrimp"
Repository = "https://github.com/sthsci/MantiShrimp"
Documentation = "https://github.com/sthsci/MantiShrimp/blob/main/docs/model.md"
Issues = "https://github.com/sthsci/MantiShrimp/issues"
Changelog = "https://github.com/sthsci/MantiShrimp/blob/main/CHANGELOG.md"
Citation = "https://github.com/sthsci/MantiShrimp/blob/main/CITATION.cff"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
